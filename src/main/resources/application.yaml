spring:
  application:
    name: asistente-soc

  datasource:
    url: jdbc:postgresql://localhost:5432/asistente_soc_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.2
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        # Usa el mismo datasource de arriba (misma BD que ya trae la extension `vector` via init.sql)
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Configuracion propia del modulo RAG (Estudiante 2)
rag:
  manuals-location: classpath:manuals/*.md
  top-k: 4