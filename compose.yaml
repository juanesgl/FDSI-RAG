services:
  db:
    image: pgvector/pgvector:pg16
    container_name: asistente-soc-postgres
    environment:
      POSTGRES_DB: asistente_soc_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:Z
      - postgres_soc_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d asistente_soc_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: asistente-soc-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASISTENTE_DB_URL: jdbc:postgresql://db:5432/asistente_soc_db
      ASISTENTE_DB_USERNAME: postgres
      ASISTENTE_DB_PASSWORD: root
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    ports:
      - "8080:8080"

volumes:
  postgres_soc_storage: